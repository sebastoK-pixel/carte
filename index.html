<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter au contact</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg-color: #0d0d0d;
      --btn-color: #ffffff;
      --btn-text: #000000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      text-align: center;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 500;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
      color: #ffffffcc;
    }
    a {
      display: inline-block;
      background-color: var(--btn-color);
      color: var(--btn-text);
      text-decoration: none;
      padding: 18px 45px;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 600;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(255,255,255,0.08);
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <h1>Ajouter le contact</h1>
  <a id="save" href="#">💾 Ajouter au contact</a>

  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('c');
    if (slug) {
      const baseRaw = "https://raw.githubusercontent.com/sebastok-pixel/carte/main/vcf/";
      document.getElementById('save').href = baseRaw + encodeURIComponent(slug) + ".vcf";
    } else {
      document.getElementById('save').textContent = "Contact introuvable";
      document.getElementById('save').style.opacity = "0.6";
    }
  </script>
</body>
</html>
